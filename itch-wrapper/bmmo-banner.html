<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Banner für browsermmorpg.com</title>
<!--
  BANNER fuer browsermmorpg.com. Gerendert auf 864x384, Datei 1728x768 (deviceScaleFactor 2).

  ZU DEN MASSEN: Die Seite nennt im Formular keine Pixelmasse. Die 864x384 sind an der
  AUSLIEFERUNG gemessen (11.09.2026): Eine gelistete Spielseite liefert ihr Banner als
  og:image ueber Cloudflare Images mit "w=864,h=384,fit=cover" aus. fit=cover schneidet jedes
  andere Seitenverhaeltnis zu - deshalb exakt 9:4, und deshalb der Name im Bild: Das Banner ist
  das, was beim Teilen des Eintrags in Discord, Reddit und Co. erscheint.

  OHNE BANNER KEIN EINTRAG: "Banner image was not uploaded" war am 11.09.2026 der einzige Grund,
  aus dem der Eintrag #1799 als "Delisted" stand (docs/marketing-einreichungen.md).

  Englisch, nicht Deutsch: Das Verzeichnis ist international, die Beschreibung dort ist es auch.
  Dass das Spiel deutsch ist, steht als Abzeichen im Bild - ehrlich vor dem Klick, nicht erst
  danach.

  Rendern:  node itch-wrapper/theme-bauen.js bmmo-banner
-->
<style>
  html,body{margin:0;padding:0;width:864px;height:384px;overflow:hidden;background:#0B1020;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  canvas{position:absolute;inset:0;}
  .schleier{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg,rgba(11,16,32,.94) 0%,rgba(11,16,32,.86) 40%,rgba(11,16,32,0) 68%);}
  .inhalt{position:absolute;left:54px;top:0;height:384px;width:470px;
    display:flex;flex-direction:column;justify-content:center;z-index:2;}
  .marke{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:#F09849;
    margin:0 0 14px;font-weight:600;}
  h1{font-size:60px;line-height:1;margin:0 0 16px;letter-spacing:-.025em;font-weight:600;
    color:#E9ECF5;text-shadow:0 3px 22px rgba(0,0,0,.75);}
  .zeile{font-size:17px;line-height:1.5;color:#9AA6BE;margin:0 0 22px;max-width:430px;}
  .marken{display:flex;gap:9px;}
  .m{font-size:12.5px;color:#5DD48D;border:1px solid rgba(93,212,141,.42);border-radius:99px;
    padding:5px 13px;background:rgba(11,16,32,.72);}
  .m.grau{color:#9AA6BE;border-color:#28324A;}
</style>
</head>
<body>
<canvas id="sterne"></canvas>
<div class="schleier"></div>
<div class="inhalt">
  <p class="marke">Space empire builder · Browser · Free</p>
  <h1>Kolonie Kepler-7</h1>
  <p class="zeile">Expand your colony, research technologies, build fleets – and share one galaxy with every other player.</p>
  <div class="marken">
    <span class="m">No pay-to-win</span>
    <span class="m grau">No download</span>
    <span class="m grau">In German</span>
  </div>
</div>
<script src="kulisse.js"></script>
<script>
Kulisse.zeichne(document.getElementById('sterne'), {
  breite: 864, hoehe: 384,
  sternFlaeche: 2400,
  // Der Planet steht rechts und passt bei 9:4 ganz ins Bild (fr ist ein Anteil der HOEHE:
  // r = 0.48 * 384 = 184 px, Mitte bei x = 0.80 * 864 = 691) - anders als im flachen itch-Banner,
  // wo er unten hinausragen muss, um nicht zur Murmel zu werden.
  planet: { fx: .80, fy: .50, fr: .48 },
  orbits: [
    { rx: 1.34, ry: 1.30, dreh: -14, punkte: 2, start: 2.1, tempo: .10, a: .24 },
    { rx: 1.74, ry: 1.68, dreh: -14, punkte: 1, start: 4.4, tempo: -.07, a: .15, punktR: 2 }
  ]
});
</script>
</body>
</html>
