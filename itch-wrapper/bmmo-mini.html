<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Mini-Bild für browsermmorpg.com</title>
<!--
  MINI-BILD ("Small index image (mini)") fuer browsermmorpg.com, gerendert auf EXAKT 180x75 (skala 1).

  ZU DEN MASSEN: Das Upload-Formular sagt es woertlich (11.09.2026): "Image dimensions should be
  180x75px, Maximum image size: 1024kB". Die Checkliste nennt es "tiny square shown next to your
  game in compact lists" - das Formular verlangt trotzdem 12:5, und das Formular prueft.

  Bei 180x75 traegt nur der Name; eine Zeile in 6,5 px ist die Grenze des Lesbaren und bleibt
  bewusst kurz. Dieselbe Kulisse wie alle anderen Verzeichnis-Bilder.

  Rendern:  node itch-wrapper/theme-bauen.js bmmo-mini
-->
<style>
  html,body{margin:0;padding:0;width:180px;height:75px;overflow:hidden;background:#0B1020;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  canvas{position:absolute;inset:0;}
  .schleier{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg,rgba(11,16,32,.94) 0%,rgba(11,16,32,.84) 48%,rgba(11,16,32,0) 76%);}
  .inhalt{position:absolute;left:10px;top:0;height:75px;width:112px;
    display:flex;flex-direction:column;justify-content:center;z-index:2;}
  .marke{font-size:6.5px;letter-spacing:.14em;text-transform:uppercase;color:#F09849;
    margin:0 0 3px;font-weight:600;}
  h1{font-size:15.5px;line-height:1.02;margin:0;letter-spacing:-.02em;font-weight:600;
    color:#E9ECF5;text-shadow:0 1px 6px rgba(0,0,0,.8);}
</style>
</head>
<body>
<canvas id="sterne"></canvas>
<div class="schleier"></div>
<div class="inhalt">
  <p class="marke">Sci-Fi · Browser</p>
  <h1>Kolonie<br>Kepler-7</h1>
</div>
<script src="kulisse.js"></script>
<script>
Kulisse.zeichne(document.getElementById('sterne'), {
  breite: 180, hoehe: 75,
  sternFlaeche: 700,
  planet: { fx: .84, fy: .50, fr: .46 },
  orbits: [
    { rx: 1.40, ry: 1.34, dreh: -14, punkte: 2, start: 2.1, tempo: .10, a: .24 }
  ]
});
</script>
</body>
</html>
