<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Banner</title>
<!--
  BANNER fuer die itch.io-Spielseite. Gerendert auf 960x300.

  ZU DEN MASSEN, weil sie eine Entscheidung sind und keine Vorgabe: itch.io nennt in seiner
  Doku (itch.io/docs/creators/design, geprueft 21.08.2026) fuer den Banner AUSDRUECKLICH keine
  Pixelmasse - nur "It can be a semi-transparent PNG, it could be an animated GIF" und den
  Hinweis, dass er "replaces the title otherwise shown just above the description".
  Die 960 sind deshalb GEMESSEN statt geraten: Auf der fertigen Seite fuellt die 960 px breite
  Einbettung die Inhaltsspalte exakt von Kante zu Kante. Ein breiterer Banner wird
  heruntergerechnet, ein schmalerer laesst Luecken.
  Die Hoehe 300 ist frei gewaehlt - flach genug, dass Titel UND Beschreibung ohne Scrollen
  ins Bild passen.

  ER ERSETZT DEN TITEL. Deshalb steht der Spielname darin, gross und lesbar. Ein Banner ohne
  Namen loescht die Ueberschrift der Seite, statt sie zu schmuecken.

  Rendern:  node itch-wrapper/theme-bauen.js
-->
<style>
  html,body{margin:0;padding:0;width:960px;height:300px;overflow:hidden;}
  body{
    background:#0B1020; color:#E6EAF2; position:relative;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  canvas#sterne{position:absolute;inset:0;}
  .planet{
    position:absolute; right:-70px; top:-120px; width:360px; height:360px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #F0A85E 0%, #C2410C 42%, #7C2D12 68%, #3B1608 100%);
    box-shadow:0 0 90px rgba(240,152,73,.32), inset -28px -22px 62px rgba(0,0,0,.55);
  }
  .ring{
    position:absolute; right:-150px; top:-200px; width:520px; height:520px;
    border-radius:50%; border:2px solid rgba(240,152,73,.26);
    transform:rotate(-16deg) scaleY(.42); transform-origin:center;
  }
  .mond{
    position:absolute; right:322px; top:196px; width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #C7D2E8 0%, #8994AC 55%, #4A5468 100%);
    box-shadow:0 0 20px rgba(160,180,220,.4);
  }
  /* Der Textbereich endet bewusst bei 620 px. Der Planet beginnt bei x=960+70-360=670 -
     50 px Abstand, damit keine Zeile in die orange Scheibe laeuft (dieselbe Rechnung wie
     beim Abzeichen-Band des Covers). */
  .inhalt{position:absolute; left:46px; top:52px; width:574px;}
  .marke{
    font-size:12px; letter-spacing:.19em; text-transform:uppercase;
    color:#F09849; font-weight:600; margin:0 0 12px;
  }
  h1{
    margin:0 0 14px; font-size:60px; line-height:.96; font-weight:800;
    letter-spacing:-.028em; text-shadow:0 3px 22px rgba(0,0,0,.75); white-space:nowrap;
  }
  .zeile{
    margin:0; font-size:18px; line-height:1.35; color:#B9C4DA; font-weight:500;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<canvas id="sterne" width="960" height="300"></canvas>
<div class="ring"></div>
<div class="planet"></div>
<div class="mond"></div>
<div class="inhalt">
  <p class="marke">Weltraum-Aufbauspiel · Browser · Deutsch · Kostenlos</p>
  <h1>Kolonie Kepler-7</h1>
  <p class="zeile">Baue aus, erforsche, stelle eine Flotte auf – und teile dir eine Galaxie mit allen Spielern.</p>
</div>
<script>
(function () {
  var c = document.getElementById('sterne'), x = c.getContext('2d');
  var n = Math.round(960 * 300 / 2600);
  for (var i = 0; i < n; i++) {
    x.globalAlpha = Math.random() * .5 + .3;
    x.fillStyle = '#CBD6F0';
    x.beginPath();
    x.arc(Math.random() * 960, Math.random() * 300, Math.random() * 1.5 + .5, 0, 6.284);
    x.fill();
  }
  x.globalAlpha = 1;
})();
</script>
</body>
</html>
