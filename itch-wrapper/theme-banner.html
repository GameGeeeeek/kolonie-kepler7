<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Banner</title>
<!--
  BANNER fuer itch.io. Gerendert auf 960x300, Datei 1920x600 (deviceScaleFactor 2).

  ZU DEN MASSEN: itch.io nennt KEINE Pixelmasse. Die 960 sind an der fertigen Seite
  GEMESSEN - die 960 px breite Einbettung fuellt die Inhaltsspalte exakt von Kante zu Kante.
  300 Hoehe ist ein Drittel davon: hoch genug fuer den Namen, flach genug, dass die
  Beschreibung darunter ohne Scrollen anfaengt.

  DER BANNER ERSETZT DIE UEBERSCHRIFT (Doku: "replaces the title otherwise shown just above
  the description"). Deshalb steht der Spielname darin. Ein Banner ohne Namen loescht den
  Titel der Seite, statt ihn zu schmuecken - das ist keine Geschmacksfrage.

  Rendern:  node itch-wrapper/theme-bauen.js banner
-->
<style>
  html,body{margin:0;padding:0;width:960px;height:300px;overflow:hidden;background:#0B1020;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  canvas{position:absolute;inset:0;}
  .inhalt{position:absolute;left:52px;top:0;height:300px;width:585px;
    display:flex;flex-direction:column;justify-content:center;z-index:2;}
  .marke{font-size:11.5px;letter-spacing:.145em;text-transform:uppercase;color:#F09849;
    margin:0 0 12px;font-weight:600;}
  h1{font-size:54px;line-height:1;margin:0 0 14px;letter-spacing:-.025em;font-weight:600;
    color:#E9ECF5;text-shadow:0 3px 22px rgba(0,0,0,.75);}
  .zeile{font-size:16px;line-height:1.5;color:#9AA6BE;margin:0;max-width:480px;}
  /* Weicher Verlauf von links: Der Text steht auf dem Sternenfeld, und ohne diesen Schleier
     laeuft ein zufaellig heller Stern mitten durch einen Buchstaben. Gemessen am gerenderten
     Bild, nicht geschaetzt. */
  .schleier{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg,rgba(11,16,32,.94) 0%,rgba(11,16,32,.86) 42%,rgba(11,16,32,0) 74%);}
</style>
</head>
<body>
<canvas id="sterne"></canvas>
<div class="schleier"></div>
<div class="inhalt">
  <p class="marke">Weltraum-Aufbauspiel · Browser · Deutsch · Kostenlos</p>
  <h1>Kolonie Kepler-7</h1>
  <p class="zeile">Baue aus, erforsche, stelle eine Flotte auf – und teile dir eine Galaxie mit allen Spielern.</p>
</div>
<script src="kulisse.js"></script>
<script>
Kulisse.zeichne(document.getElementById('sterne'), {
  breite: 960, hoehe: 300,
  sternFlaeche: 2400,
  // Der Planet steht rechts und ragt bewusst UNTEN aus dem Bild: So wirkt er gross, ohne
  // dass die flache Bannerhoehe ihn auf eine Murmel zusammendrueckt.
  // fy leicht UNTER der Unterkante: Der Koerper ragt aus dem Bild und wirkt gross, ohne
  // dass die flache Bannerhoehe ihn auf eine Murmel zusammendrueckt. fr 0.58 statt 1.05 -
  // beim ersten Anlauf fuellte der Planet das halbe Banner und las sich als Wand.
  planet: { fx: .80, fy: 1.02, fr: .58 },
  orbits: [
    { rx: 1.34, ry: 1.30, dreh: -14, punkte: 2, start: 2.1, tempo: .10, a: .24 },
    { rx: 1.74, ry: 1.68, dreh: -14, punkte: 1, start: 4.4, tempo: -.07, a: .15, punktR: 2 }
  ]
});
</script>
</body>
</html>
