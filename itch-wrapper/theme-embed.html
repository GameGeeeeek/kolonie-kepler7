<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Embed-Hintergrund</title>
<!--
  EMBED-HINTERGRUND ("Embed BG") fuer itch.io. Gerendert auf 960x600.

  ==> WICHTIG, UND ES IST GEMESSEN, NICHT VERMUTET: Bei der AKTUELLEN Einstellung zeigt itch.io
  dieses Bild GAR NICHT. Die Doku (itch.io/docs/creators/html5, geprueft 21.08.2026) beschreibt
  es woertlich als "A image that takes up the size of the viewport that sits behind the Play
  button" - und den Play-Knopf gibt es nur im Modus "Click to play". Die Spielseite steht auf
  "Embed in page" (dokumentiert in docs/marketing-einreichungen.md), die Einbettung laedt also
  sofort und fuellt ihre 960x600 vollstaendig mit der Startkarte. Dahinter ist nichts zu sehen.

  Warum es trotzdem existiert: Der Umschalter kostet zwei Klicks, und wer ihn je umlegt, hat
  das passende Bild dann schon. Ein hochgeladenes Bild ohne Wirkung schadet nicht - eine
  Startkarte, die ploetzlich auf weissem Grund steht, schon.

  Von "Click to play" wird ABGERATEN, und auch das ist eine Rechnung, keine Meinung: Die
  Einbettung IST bereits eine Startkarte mit einem Knopf. Mit "Click to play" braeuchte der
  Spieler DREI Klicks bis ins Spiel (Play -> Startkarte -> eigener Tab) statt zwei.

  Die Masse 960x600 sind exakt die eingestellte Einbettungsgroesse - der "viewport" aus der
  Doku ist genau diese Flaeche.

  Rendern:  node itch-wrapper/theme-bauen.js
-->
<style>
  html,body{margin:0;padding:0;width:960px;height:600px;overflow:hidden;}
  body{
    background:#0B1020; color:#E6EAF2; position:relative;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  canvas#sterne{position:absolute;inset:0;}
  .planet{
    position:absolute; right:-140px; bottom:-210px; width:470px; height:470px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #F0A85E 0%, #C2410C 42%, #7C2D12 68%, #3B1608 100%);
    box-shadow:0 0 100px rgba(240,152,73,.30), inset -34px -26px 74px rgba(0,0,0,.55);
  }
  .ring{
    position:absolute; right:-230px; bottom:-300px; width:650px; height:650px;
    border-radius:50%; border:2px solid rgba(240,152,73,.24);
    transform:rotate(-16deg) scaleY(.42); transform-origin:center;
  }
  /* Der Titel steht OBEN und nicht mittig: Im "Click to play"-Modus legt itch.io den
     Play-Knopf in die Mitte der Flaeche - ein Titel dort waere halb verdeckt. */
  .inhalt{position:absolute; left:56px; top:60px; right:380px;}
  .marke{
    font-size:12px; letter-spacing:.19em; text-transform:uppercase;
    color:#F09849; font-weight:600; margin:0 0 12px;
  }
  h1{
    margin:0; font-size:46px; line-height:1.02; font-weight:800;
    letter-spacing:-.025em; text-shadow:0 3px 22px rgba(0,0,0,.75);
  }
</style>
</head>
<body>
<canvas id="sterne" width="960" height="600"></canvas>
<div class="ring"></div>
<div class="planet"></div>
<div class="inhalt">
  <p class="marke">Weltraum-Aufbauspiel · Browser</p>
  <h1>Kolonie<br>Kepler-7</h1>
</div>
<script>
(function () {
  var c = document.getElementById('sterne'), x = c.getContext('2d');
  var n = Math.round(960 * 600 / 2600);
  for (var i = 0; i < n; i++) {
    x.globalAlpha = Math.random() * .5 + .3;
    x.fillStyle = '#CBD6F0';
    x.beginPath();
    x.arc(Math.random() * 960, Math.random() * 600, Math.random() * 1.5 + .5, 0, 6.284);
    x.fill();
  }
  x.globalAlpha = 1;
})();
</script>
</body>
</html>
