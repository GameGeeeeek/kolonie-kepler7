<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Embed-Hintergrund</title>
<!--
  EMBED-BG fuer itch.io. Gerendert auf 960x600 - exakt die eingestellte Einbettungsgroesse.

  WANN DAS BILD UEBERHAUPT ERSCHEINT: Die Doku (itch.io/docs/creators/html5) beschreibt es
  als "A image that takes up the size of the viewport that sits behind the Play button" -
  den Play-Knopf gibt es NUR im Modus "Click to play". Bei "Embed in page" laedt die
  Startkarte sofort und fuellt ihre 960x600 vollstaendig; das Bild ist dann unsichtbar.
  Es liegt trotzdem bei, damit es da ist, falls der Modus wechselt.

  Rendern:  node itch-wrapper/theme-bauen.js embed
-->
<style>
  html,body{margin:0;padding:0;width:960px;height:600px;overflow:hidden;background:#0B1020;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  canvas{position:absolute;inset:0;}
  .inhalt{position:absolute;left:64px;top:0;height:600px;width:470px;
    display:flex;flex-direction:column;justify-content:center;z-index:2;}
  .marke{font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;color:#F09849;
    margin:0 0 16px;font-weight:600;}
  h1{font-size:66px;line-height:1.02;margin:0 0 18px;letter-spacing:-.025em;font-weight:600;
    color:#E9ECF5;text-shadow:0 4px 26px rgba(0,0,0,.8);}
  .zeile{font-size:17px;line-height:1.55;color:#9AA6BE;margin:0 0 26px;max-width:400px;}
  .merkmale{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;}
  .merkmale li{font-size:13px;color:#9AA6BE;border:1px solid #28324A;border-radius:99px;
    padding:5px 13px;background:rgba(255,255,255,.03);}
  .merkmale li.frei{color:#5DD48D;border-color:rgba(93,212,141,.4);}
  .schleier{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg,rgba(11,16,32,.93) 0%,rgba(11,16,32,.82) 44%,rgba(11,16,32,0) 76%);}
</style>
</head>
<body>
<canvas id="sterne"></canvas>
<div class="schleier"></div>
<div class="inhalt">
  <p class="marke">Weltraum-Aufbauspiel · Browser</p>
  <h1>Kolonie<br>Kepler-7</h1>
  <p class="zeile">Kolonie ausbauen, Flotte aufstellen, geteilte Galaxie.</p>
  <ul class="merkmale">
    <li class="frei">Kostenlos</li>
    <li class="frei">Kein Pay-to-Win</li>
    <li>Kein Download</li>
  </ul>
</div>
<script src="kulisse.js"></script>
<script>
Kulisse.zeichne(document.getElementById('sterne'), {
  breite: 960, hoehe: 600,
  sternFlaeche: 2400,
  planet: { fx: .83, fy: .50, fr: .40 },
  orbits: [
    { rx: 1.34, ry: 1.28, dreh: -18, punkte: 3, start: 1.2, tempo: .10, a: .26 },
    { rx: 1.72, ry: 1.64, dreh: -18, punkte: 2, start: 3.9, tempo: -.07, a: .17, punktR: 2 },
    { rx: 2.14, ry: 2.04, dreh: -18, punkte: 1, start: 5.6, tempo: .05, a: .11, punktR: 1.8 }
  ]
});
</script>
</body>
</html>
