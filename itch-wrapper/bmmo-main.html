<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Hauptbild für browsermmorpg.com</title>
<!--
  HAUPTBILD ("Main image (preview)") fuer browsermmorpg.com: "Main listing image visitors see on
  your game page." Gerendert auf 800x600, Datei 1600x1200 (deviceScaleFactor 2).

  ZU DEN MASSEN: An einer gelisteten Spielseite gemessen (11.09.2026) - das grosse Galeriebild
  kommt als "w=800,h=600,fit=contain". fit=contain schneidet nichts ab, sondern passt ein: Ein
  16:9-Screenshot bekaeme oben und unten Balken. Deshalb exakt 4:3, und deshalb dieselbe
  Kulisse wie Banner und itch.io-Cover - das Spiel sieht in jedem Verzeichnis gleich aus.

  Die Screenshots daneben (node marketing-screenshots.js, 16:9) zeigen das Spiel; dieses Bild
  sagt in einem Blick, WAS es ist. Englisch wie das Banner, mit "In German" als Abzeichen.

  Rendern:  node itch-wrapper/theme-bauen.js bmmo-main
-->
<style>
  html,body{margin:0;padding:0;width:800px;height:600px;overflow:hidden;background:#0B1020;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  canvas{position:absolute;inset:0;}
  .schleier{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(108deg,rgba(11,16,32,.94) 0%,rgba(11,16,32,.84) 40%,rgba(11,16,32,0) 72%);}
  .inhalt{position:absolute;left:56px;top:84px;width:400px;z-index:2;}
  .marke{font-size:13px;letter-spacing:.17em;text-transform:uppercase;color:#F09849;
    margin:0 0 14px;font-weight:600;}
  h1{font-size:62px;line-height:1.02;margin:0 0 18px;letter-spacing:-.025em;font-weight:600;
    color:#E9ECF5;text-shadow:0 3px 22px rgba(0,0,0,.8);}
  .zeile{font-size:18px;line-height:1.55;color:#9AA6BE;margin:0;max-width:380px;}
  .marken{position:absolute;left:56px;bottom:56px;display:flex;gap:9px;z-index:2;}
  .m{font-size:13px;color:#5DD48D;border:1px solid rgba(93,212,141,.42);border-radius:99px;
    padding:5px 13px;background:rgba(11,16,32,.72);}
  .m.grau{color:#9AA6BE;border-color:#28324A;}
</style>
</head>
<body>
<canvas id="sterne"></canvas>
<div class="schleier"></div>
<div class="inhalt">
  <p class="marke">Space empire builder · Browser · Free</p>
  <h1>Kolonie<br>Kepler-7</h1>
  <p class="zeile">Expand your colony, research technologies, build fleets – and share one galaxy with every other player.</p>
</div>
<div class="marken">
  <span class="m">No pay-to-win</span>
  <span class="m grau">No download</span>
  <span class="m grau">In German</span>
</div>
<script src="kulisse.js"></script>
<script>
Kulisse.zeichne(document.getElementById('sterne'), {
  breite: 800, hoehe: 600,
  sternFlaeche: 2200,
  // Planet rechts unten, ragt am rechten Rand hinaus (wie beim itch.io-Cover): gross genug, um
  // das Bild zu tragen, ohne die Textspalte links (bis x=456) zu beruehren - r = .44*600 = 264,
  // Mitte x = .78*800 = 624, linker Rand also bei 360, unter dem Schleier.
  planet: { fx: .78, fy: .58, fr: .44 },
  orbits: [
    { rx: 1.30, ry: 1.24, dreh: -20, punkte: 2, start: 1.9, tempo: .10, a: .27 },
    { rx: 1.66, ry: 1.58, dreh: -20, punkte: 1, start: 4.6, tempo: -.07, a: .17, punktR: 2 }
  ]
});
</script>
</body>
</html>
