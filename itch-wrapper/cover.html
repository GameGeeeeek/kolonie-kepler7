<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Coverbild</title>
<!--
  COVERBILD fuer itch.io. Gerendert auf 630x500, Datei 1260x1000 (deviceScaleFactor 2).

  ZU DEN MASSEN: Das ist das EINZIGE Bild, fuer das itch.io eine Groesse nennt - die Doku
  verlangt 630x500 und schneidet abweichende Seitenverhaeltnisse zu. Es erscheint in Suche,
  Stoeberlisten und Sammlungen, also fast immer VERKLEINERT: Was bei 315x250 nicht lesbar
  ist, existiert praktisch nicht.

  Deshalb nur DREI Textgroessen und keine vierte Zeile - der Name muss auch im Daumennagel
  tragen.

  Rendern:  node itch-wrapper/theme-bauen.js cover
-->
<style>
  html,body{margin:0;padding:0;width:630px;height:500px;overflow:hidden;background:#0B1020;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  canvas{position:absolute;inset:0;}
  .schleier{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(108deg,rgba(11,16,32,.94) 0%,rgba(11,16,32,.84) 40%,rgba(11,16,32,0) 72%);}
  .inhalt{position:absolute;left:42px;top:60px;width:300px;z-index:2;}
  .marke{font-size:11.5px;letter-spacing:.17em;text-transform:uppercase;color:#F09849;
    margin:0 0 12px;font-weight:600;}
  h1{font-size:47px;line-height:1.02;margin:0 0 16px;letter-spacing:-.025em;font-weight:600;
    color:#E9ECF5;text-shadow:0 3px 22px rgba(0,0,0,.8);}
  .zeile{font-size:15px;line-height:1.55;color:#9AA6BE;margin:0;}
  /*
    DREI Abzeichen, und das ist neu gerechnet statt uebernommen: Hier stand, drei liefen
    unter die Planetenkante, deshalb muesse "Deutsch" in die Klassifikationszeile. Beides
    stimmt seit dem kleineren Planeten nicht mehr - er sitzt bei cx=542/cy=190 mit r=200
    und endet damit schon bei y=390, das Abzeichen-Band liegt bei y=428..458 also komplett
    frei. Umgekehrt brach die Klassifikationszeile mit "Deutsch" auf ZWEI Zeilen um
    (40 Zeichen brauchen rund 380 px, die Spalte hat 300) - gesehen am gerenderten Bild,
    im Quelltext unauffaellig. "Deutsch" steht deshalb jetzt unten bei den Abzeichen.
    Wer die Planetengroesse anfasst, rechnet beides neu.
  */
  .marken{position:absolute;left:42px;bottom:42px;display:flex;gap:9px;z-index:2;}
  .m{font-size:12.5px;color:#5DD48D;border:1px solid rgba(93,212,141,.42);border-radius:99px;
    padding:5px 13px;background:rgba(11,16,32,.72);}
  .m.grau{color:#9AA6BE;border-color:#28324A;}
</style>
</head>
<body>
<canvas id="sterne"></canvas>
<div class="schleier"></div>
<div class="inhalt">
  <p class="marke">Weltraum-Aufbauspiel · Browser</p>
  <h1>Kolonie<br>Kepler-7</h1>
  <p class="zeile">Baue deine Kolonie aus, stelle<br>eine Flotte auf, teile dir eine<br>Galaxie mit allen Spielern.</p>
</div>
<div class="marken">
  <span class="m">Kein Pay-to-Win</span>
  <span class="m grau">Kostenlos</span>
  <span class="m grau">Deutsch</span>
</div>
<script src="kulisse.js"></script>
<script>
Kulisse.zeichne(document.getElementById('sterne'), {
  breite: 630, hoehe: 500,
  sternFlaeche: 2200,
  planet: { fx: .86, fy: .38, fr: .40 },
  orbits: [
    { rx: 1.30, ry: 1.24, dreh: -20, punkte: 2, start: 1.9, tempo: .10, a: .27 },
    { rx: 1.66, ry: 1.58, dreh: -20, punkte: 1, start: 4.6, tempo: -.07, a: .17, punktR: 2 }
  ]
});
</script>
</body>
</html>
