<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Coverbild</title>
<!--
  COVERBILD fuer itch.io. Gerendert auf 630x500.

  Die Masse sind nicht frei gewaehlt: itch.io verlangt das Seitenverhaeltnis 315:250, Minimum
  315x250, empfohlen 630x500 (an der itch.io-Dokumentation geprueft, 21.08.2026). Das Bild
  erscheint in Suche und Stoebern - dort als THUMBNAIL. Deshalb wenige, grosse Elemente:
  Wer es auf 315 px Breite nicht lesen kann, sieht es im Katalog nicht.

  Dieselbe Palette wie die Startkarte und das Spiel - eine zweite Bildsprache waere die
  uebliche zweite Anzeigestelle, die beim naechsten Umbau auseinanderlaeuft.

  Rendern:  node itch-wrapper/cover-bauen.js   -> presse-bilder/itch-cover.png
-->
<style>
  html,body{margin:0;padding:0;width:630px;height:500px;overflow:hidden;}
  body{
    background:#0B1020; color:#E6EAF2; position:relative;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  canvas#sterne{position:absolute;inset:0;}
  .planet{
    position:absolute; right:-130px; bottom:-190px; width:430px; height:430px;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #F0A85E 0%, #C2410C 42%, #7C2D12 68%, #3B1608 100%);
    box-shadow:0 0 90px rgba(240,152,73,.34), inset -34px -26px 74px rgba(0,0,0,.55);
  }
  .ring{
    position:absolute; right:-215px; bottom:-275px; width:600px; height:600px;
    border-radius:50%; border:2px solid rgba(240,152,73,.28);
    transform:rotate(-16deg) scaleY(.42); transform-origin:center;
  }
  .mond{
    position:absolute; right:262px; bottom:214px; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #C7D2E8 0%, #8994AC 55%, #4A5468 100%);
    box-shadow:0 0 22px rgba(160,180,220,.4);
  }
  .inhalt{position:absolute; left:44px; top:52px; right:250px;}
  .marke{
    font-size:13px; letter-spacing:.17em; text-transform:uppercase;
    color:#F09849; font-weight:600; margin:0 0 16px;
  }
  h1{
    margin:0 0 16px; font-size:56px; line-height:.98; font-weight:800;
    letter-spacing:-.025em; text-shadow:0 3px 22px rgba(0,0,0,.75);
  }
  .zeile{
    margin:0; font-size:19px; line-height:1.36; color:#B9C4DA; font-weight:500;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
  .marken{position:absolute; left:44px; bottom:44px; display:flex; gap:9px; flex-wrap:wrap;}
  .m{
    font-size:14px; font-weight:600; padding:7px 14px; border-radius:999px;
    border:1.5px solid #5DD48D; color:#5DD48D; background:rgba(93,212,141,.1);
    white-space:nowrap;
  }
  .m.grau{border-color:#3E4A63; color:#9AA6BE; background:rgba(20,28,46,.6);}
</style>
</head>
<body>
<canvas id="sterne" width="630" height="500"></canvas>
<div class="ring"></div>
<div class="planet"></div>
<div class="mond"></div>

<div class="inhalt">
  <p class="marke">Weltraum-Aufbauspiel · Browser · Deutsch</p>
  <h1>Kolonie<br>Kepler-7</h1>
  <p class="zeile">Baue deine Kolonie aus, stelle<br>eine Flotte auf, teile dir eine<br>Galaxie mit allen Spielern.</p>
</div>

<!--
  NUR ZWEI Abzeichen, und das ist gerechnet statt geschaetzt: Der Planet beginnt bei x=330
  (630 + 130 rechter Versatz - 430 Breite) und reicht ab y=260 nach unten. Das Abzeichen-Band
  liegt bei y=424..456, also mitten darin. Drei Abzeichen enden bei x=391 - 61 px IM Planeten,
  grau auf orange, im Thumbnail nicht lesbar. Zwei enden bei x=299 und halten 31 px Abstand.
  "Deutsch" steht deshalb oben in der Klassifikationszeile, wo es ohnehin hingehoert.
  Wer ein drittes Abzeichen ergaenzen will, rechnet zuerst nach.
-->
<div class="marken">
  <span class="m">Kein Pay-to-Win</span>
  <span class="m grau">Kostenlos</span>
</div>

<script>
(function () {
  var c = document.getElementById('sterne'), x = c.getContext('2d');
  var n = Math.round(630 * 500 / 2600);
  for (var i = 0; i < n; i++) {
    x.globalAlpha = Math.random() * .5 + .3;
    x.fillStyle = '#CBD6F0';
    x.beginPath();
    x.arc(Math.random() * 630, Math.random() * 500, Math.random() * 1.5 + .5, 0, 6.284);
    x.fill();
  }
  x.globalAlpha = 1;
})();
</script>
</body>
</html>
