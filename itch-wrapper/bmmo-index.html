<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolonie Kepler-7 – Kachel für browsermmorpg.com</title>
<!--
  KLEINE STARTSEITEN-KACHEL ("Small index image") fuer browsermmorpg.com.
  Gerendert auf 240x100, Datei 720x300 (deviceScaleFactor 3 - die Kachel ist winzig, und
  auf einem Handy-Bildschirm mit dreifacher Dichte waere eine 480er Datei schon weich).

  ZU DEN MASSEN: An der Startseite von browsermmorpg.com gemessen (11.09.2026) - die Kacheln
  der gelisteten Spiele kommen als "w=240,h=100,fit=cover". Anderes Seitenverhaeltnis wird
  zugeschnitten, deshalb exakt 12:5.

  Nur der Name und eine Zeile: Was bei 240x100 nicht lesbar ist, existiert nicht.

  Rendern:  node itch-wrapper/theme-bauen.js bmmo-index
-->
<style>
  html,body{margin:0;padding:0;width:240px;height:100px;overflow:hidden;background:#0B1020;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  canvas{position:absolute;inset:0;}
  .schleier{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(100deg,rgba(11,16,32,.94) 0%,rgba(11,16,32,.84) 46%,rgba(11,16,32,0) 74%);}
  .inhalt{position:absolute;left:14px;top:0;height:100px;width:150px;
    display:flex;flex-direction:column;justify-content:center;z-index:2;}
  .marke{font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;color:#F09849;
    margin:0 0 5px;font-weight:600;}
  h1{font-size:21px;line-height:1;margin:0;letter-spacing:-.02em;font-weight:600;
    color:#E9ECF5;text-shadow:0 2px 10px rgba(0,0,0,.8);}
</style>
</head>
<body>
<canvas id="sterne"></canvas>
<div class="schleier"></div>
<div class="inhalt">
  <p class="marke">Sci-Fi · Browser · Free</p>
  <h1>Kolonie<br>Kepler-7</h1>
</div>
<script src="kulisse.js"></script>
<script>
Kulisse.zeichne(document.getElementById('sterne'), {
  breite: 240, hoehe: 100,
  sternFlaeche: 900,
  planet: { fx: .82, fy: .50, fr: .44 },
  orbits: [
    { rx: 1.40, ry: 1.34, dreh: -14, punkte: 2, start: 2.1, tempo: .10, a: .24 }
  ]
});
</script>
</body>
</html>
