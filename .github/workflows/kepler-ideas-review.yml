name: Kepler CPU process benchmark
permissions:
  contents: read
concurrency:
  group: cpu-process-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-process-benchmark:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - pc-saschaneu
    timeout-minutes: 30
    env:
      PC_CHROMIUM_GPU: '0'
      KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
      CPU_BENCHMARK_SOURCE_SHA: 4668ad50754bce55e559b43b0c94ba89ba68a368
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: GameGeeeeek/kolonie-kepler7-backend
        ref: 00fe250194f419e1b0063f24da146bbb5c7041c7
        path: .review-backend
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
    - name: Install CPU helper dependency without browsers
      run: 'set -euo pipefail

        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --package-lock=false
        --no-audit --no-fund playwright@1.62.1

        git rev-parse HEAD

        test "$(git -C .review-backend rev-parse HEAD)" = 00fe250194f419e1b0063f24da146bbb5c7041c7

        '
    - name: Verify CPU pool isolation and failure counterexamples
      run: node --test tools/cpu-pool/cpu-pool.test.cjs
      env:
        TMPDIR: ${{ runner.temp }}
    - name: Compare identical CPU assertions with one, two and four processes
      run: node tools/cpu-pool/benchmark.cjs
      env:
        TMPDIR: ${{ runner.temp }}
'on':
  workflow_dispatch:
    inputs:
      runner:
        description: CPU benchmark runs only on the PC
        type: choice
        required: true
        default: pc
        options:
        - pc
