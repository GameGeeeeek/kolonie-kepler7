permissions:
  contents: read
concurrency:
  group: graphics-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete-suite:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.head_ref == 'codex/interface-clarity' || github.head_ref == 'codex/ship-sharpness' || github.head_ref == 'codex/mobile-settings-compact' || github.head_ref == 'codex/void-sector-invitation'))
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.runner == 'github') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","pc-saschaneu"]') }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: 00fe250194f419e1b0063f24da146bbb5c7041c7
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare complete repository test environment
        run: |
          mv .review-backend ../kolonie-kepler7-backend
          npm install --no-save --package-lock=false playwright@1.62.1
          npm ci --prefix ../kolonie-kepler7-backend --omit=dev
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
          git rev-parse HEAD > /tmp/kepler-tested-commit.txt
          sha256sum weltraum_kolonie.html kepler-graphics.css service-worker.js kepler-english.json kepler-gfx-*.png kepler-gfx-*.webp void-sector-invitation.png ../kolonie-kepler7-backend/server.js > /tmp/kepler-tested-source.txt
          test "$(wc -l < /tmp/kepler-tested-source.txt)" -eq 140
          test "$(grep -Ec '  kepler-gfx-.*\.png$' /tmp/kepler-tested-source.txt)" -eq 67
          test "$(grep -Ec '  kepler-gfx-.*\.webp$' /tmp/kepler-tested-source.txt)" -eq 67
      - name: Full suite partition through actual HTTP origins
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tests/http-run.js --part=${{ matrix.part }}/8 2>&1 | tee /tmp/kepler-full-${{ matrix.part }}.log
          partition_status=("${PIPESTATUS[@]}")
          result=${partition_status[0]}
          set -e
          if [ "${partition_status[1]}" -ne 0 ]; then exit "${partition_status[1]}"; fi
          # Retry only completed partitions whose failures are all named test files.
          # Mandatory/global failures in the original log remain final even if a later check passes.
          if [ "$result" -ne 0 ]; then
            if ! grep -Eq '^[0-9]+ Prüfungen, [0-9]+ fehlgeschlagen$' /tmp/kepler-full-${{ matrix.part }}.log; then
              exit "$result"
            fi
            non_file_failures=$(grep '^  FAIL ' /tmp/kepler-full-${{ matrix.part }}.log | grep -vE '^  FAIL (test_[a-zA-Z0-9_]+\.js|sweep\.js) +[0-9]+s(  \[übersprungen\])?$' || true)
            if [ -n "$non_file_failures" ]; then
              printf '%s\n' 'Non-file failures cannot be replaced by a successful file retry:' "$non_file_failures"
              exit "$result"
            fi
            mapfile -t failed < <(sed -nE 's/^  FAIL (test_[a-zA-Z0-9_]+\.js|sweep\.js) +[0-9]+s(  \[übersprungen\])?$/\1/p' /tmp/kepler-full-${{ matrix.part }}.log | sort -u)
            if [ "${#failed[@]}" -eq 0 ]; then exit "$result"; fi
            # Direct test-file retries do not run the mandatory repository checks themselves.
            node tests/run.js --nur-pflicht 2>&1 | tee /tmp/kepler-required-${{ matrix.part }}.log
            sha256sum -c /tmp/kepler-tested-source.txt
            node tests/http-run.js "${failed[@]}" 2>&1 | tee /tmp/kepler-recheck-${{ matrix.part }}.log
          fi
          sha256sum -c /tmp/kepler-tested-source.txt
      - name: Native map menu scrolling and original scanner counterexample
        if: matrix.part == 0
        run: node tools/check-map-menu-scroll-scope-counterexample.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepler-full-review-${{ matrix.part }}
          path: |
            /tmp/kepler-tested-commit.txt
            /tmp/kepler-tested-source.txt
            /tmp/kepler-full-${{ matrix.part }}.log
            /tmp/kepler-required-${{ matrix.part }}.log
            /tmp/kepler-recheck-${{ matrix.part }}.log
            /tmp/kepler7-fehlschlaege/*.log
          retention-days: 7
