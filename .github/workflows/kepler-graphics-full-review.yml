name: Kepler graphics full review
on:
  workflow_dispatch:
  push:
    branches: [codex/kepler-graphics-refresh, codex/kepler-graphics-expansion, codex/kepler-visual-harmony, codex/kepler-graphic-polish, codex/kepler-visual-details, codex/kepler-command-hud]
    paths:
      - .github/workflows/kepler-graphics-full-review.yml
      - tests/http-run.js
      - tests/lib/http-test-origin.js
      - tests/test_uebersicht_schrift.js
      - tests/test_beschriftung_ausweichen.js
      - tests/test_graphics_expansion.js
      - tests/test_hscroll.js
      - tests/test_expeditionsbox_cache.js
      - tests/test_visual_harmony.js
      - tests/test_graphic_polish.js
      - tests/test_visual_details.js
      - tools/check-visual-details-counterexamples.cjs
      - tools/check-combat-graphics-counterexamples.cjs
      - tests/test_kopfzeile_chips.js
      - tests/test_gegnerlage.js
      - tools/check-graphic-polish-counterexamples.cjs
      - tools/check-mobile-polish-counterexamples.cjs
      - tools/check-visual-harmony-counterexamples.cjs
      - kepler-graphics.css
      - weltraum_kolonie.html
      - tests/test_command_shell.js
      - tests/lib/command-shell.js
      - tools/check-command-shell-counterexamples.cjs
      - tools/check-command-secondary-counterexample.cjs
      - tests/test_zweite_ebene.js
      - tests/test_formensprache.js
      - kepler-gfx-*.png
permissions:
  contents: read
concurrency:
  group: graphics-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete-suite:
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: dda5d5d3c1dbfb5eeef9ecf5c88227014415c1ef
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare complete repository test environment
        run: |
          mv .review-backend ../kolonie-kepler7-backend
          npm install --no-save --package-lock=false playwright@1.62.1
          npm ci --prefix ../kolonie-kepler7-backend --omit=dev
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
          git rev-parse HEAD > /tmp/kepler-tested-commit.txt
          sha256sum weltraum_kolonie.html kepler-graphics.css kepler-gfx-*.png ../kolonie-kepler7-backend/server.js > /tmp/kepler-tested-source.txt
      - name: Full suite partition through actual HTTP origins
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node tests/http-run.js --part=${{ matrix.part }}/8 2>&1 | tee /tmp/kepler-full-${{ matrix.part }}.log
          partition_status=("${PIPESTATUS[@]}")
          result=${partition_status[0]}
          set -e
          if [ "${partition_status[1]}" -ne 0 ]; then exit "${partition_status[1]}"; fi
          # Retry only completed partitions whose failures are all named test files.
          # Mandatory/global failures in the original log remain final even if a later check passes.
          if [ "$result" -ne 0 ]; then
            if ! grep -Eq '^[0-9]+ Prüfungen, [0-9]+ fehlgeschlagen$' /tmp/kepler-full-${{ matrix.part }}.log; then
              exit "$result"
            fi
            non_file_failures=$(grep '^  FAIL ' /tmp/kepler-full-${{ matrix.part }}.log | grep -vE '^  FAIL (test_[a-zA-Z0-9_]+\.js|sweep\.js) +[0-9]+s(  \[übersprungen\])?$' || true)
            if [ -n "$non_file_failures" ]; then
              printf '%s\n' 'Non-file failures cannot be replaced by a successful file retry:' "$non_file_failures"
              exit "$result"
            fi
            mapfile -t failed < <(sed -nE 's/^  FAIL (test_[a-zA-Z0-9_]+\.js|sweep\.js) +[0-9]+s(  \[übersprungen\])?$/\1/p' /tmp/kepler-full-${{ matrix.part }}.log | sort -u)
            if [ "${#failed[@]}" -eq 0 ]; then exit "$result"; fi
            # Direct test-file retries do not run the mandatory repository checks themselves.
            node tests/run.js --nur-pflicht 2>&1 | tee /tmp/kepler-required-${{ matrix.part }}.log
            sha256sum -c /tmp/kepler-tested-source.txt
            node tests/http-run.js "${failed[@]}" 2>&1 | tee /tmp/kepler-recheck-${{ matrix.part }}.log
          fi
          sha256sum -c /tmp/kepler-tested-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepler-full-review-${{ matrix.part }}
          path: |
            /tmp/kepler-tested-commit.txt
            /tmp/kepler-tested-source.txt
            /tmp/kepler-full-${{ matrix.part }}.log
            /tmp/kepler-required-${{ matrix.part }}.log
            /tmp/kepler-recheck-${{ matrix.part }}.log
            /tmp/kepler7-fehlschlaege/*.log
          retention-days: 7
