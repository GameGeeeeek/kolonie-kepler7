name: Kepler graphics review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .gitattributes
      - service-worker.js
      - kepler-english.json
      - locales/en.json
      - tools/i18n/**
      - tools/ideas/sync.cjs
      - tests/lib/i18n.js
      - tests/lib/ideas-fixture.js
      - tests/test_english_complete.js
      - tests/test_english_locale.js
      - tests/test_i18n_testkontext.js
      - tests/test_lazy_language_catalog.js
      - tools/check-lazy-language-counterexamples.cjs
      - tools/check-lazy-language-unit-counterexamples.cjs
      - tests/test_command_menu_position.js
      - tools/check-command-menu-position-counterexamples.cjs
      - weltraum_kolonie.html
      - kepler-graphics.css
      - tests/test_command_shell.js
      - tests/test_mobile_settings_compact.js
      - tools/check-mobile-settings-compact-counterexamples.cjs
      - tests/test_command_quest_closed_layout.js
      - tools/check-command-quest-closed-counterexample.cjs
      - tests/lib/command-shell.js
      - tools/check-command-shell-counterexamples.cjs
      - tools/check-command-secondary-counterexample.cjs
      - tests/test_zweite_ebene.js
      - tests/test_formensprache.js
      - tests/test_resource_animation_frames.js
      - tools/check-resource-animation-counterexample.cjs
      - tools/check-overview-hint-spacing-counterexample.cjs
      - tools/check-mission-status-close-counterexample.cjs
      - tools/check-map-focus-counterexamples.cjs
      - tools/check-command-menu-gating-counterexample.cjs
      - tests/test_kartenfokus.js
      - tests/test_schirmfrage.js
      - tests/test_uebersicht_schrift.js
      - tests/test_flottenposition_abbau.js
      - tests/test_musterziel.js
      - tests/test_abgrund_ui.js
      - tests/test_allianzraid_anzeige.js
      - tests/test_k7_mobile_flows.js
      - tests/test_kanzelrahmen.js
      - tests/test_meilenstein_nachtrag.js
      - tests/test_pushziele.js
      - tests/test_raid_vorschau.js
      - tests/test_recycler_sammelauftrag.js
      - tests/test_tickruhe.js
      - kepler-gfx-*.png
      - kepler-gfx-*.webp
      - tests/test_graphics_loading.js
      - tools/check-graphics-loading-counterexamples.cjs
      - tests/test_graphics_unlock.js
      - tools/check-graphics-unlock-counterexamples.cjs
      - tests/test_ship_raster_art.js
      - tools/check-ship-raster-art-counterexamples.cjs
      - tools/check-ship-raster-fixture-counterexample.cjs
      - tests/test_kartenmenue_scrollen.js
      - tools/check-map-menu-scroll-scope-counterexample.cjs
      - tests/test_combat_raster_art.js
      - tests/test_remaining_raster_art.js
      - tools/check-remaining-raster-art-counterexamples.cjs
      - tools/check-kulissenplanet-cache-counterexample.cjs
      - tools/check-vorposten-raster-layout-counterexamples.cjs
      - tests/lib/remaining-raster-manifest.json
      - tests/lib/remaining-raster-fixture.js
      - docs/remaining-art-package.json
      - tools/check-combat-raster-art-counterexamples.cjs
      - tests/lib/combat-raster-manifest.json
      - tests/lib/combat-raster-fixture.js
      - docs/combat-art-package.json
      - docs/combat-art-prompts.json
      - tests/lib/ship-raster-fixture.js
      - tests/lib/ship-raster-manifest.json
      - tests/lib/graphics-loading-manifest.json
      - docs/ship-art-package.json
      - docs/ship-detail-art-package.json
      - docs/asteroid-mining-art-package.json
      - docs/ship-detail-art-prompts.json
      - docs/asteroid-mining-art-prompts.json
      - tests/test_ship_raster_sharpness.js
      - tools/check-ship-raster-sharpness-counterexamples.cjs
      - tests/test_asteroid_raster_art.js
      - tests/test_asteroid_banner_cache.js
      - tools/check-asteroid-raster-counterexamples.cjs
      - docs/ship-art-prompts.json
      - docs/ship-raster-assets.md
      - tests/test_graphics_refresh.js
      - tests/test_graphics_expansion.js
      - tests/test_hscroll.js
      - tests/test_expeditionsbox_cache.js
      - tests/test_visual_harmony.js
      - tests/test_graphic_polish.js
      - tests/test_visual_details.js
      - tools/check-visual-details-counterexamples.cjs
      - tools/check-combat-graphics-counterexamples.cjs
      - tests/test_kopfzeile_chips.js
      - tests/test_gegnerlage.js
      - tools/check-graphic-polish-counterexamples.cjs
      - tools/check-mobile-polish-counterexamples.cjs
      - tests/test_reiterleiste.js
      - tests/test_reitergruppen.js
      - tests/test_verdichtung.js
      - tests/test_gegenstandskatalog.js
      - tests/test_kopfzeile_tippziele.js
      - tests/test_bewertungskarte.js
      - tests/http-run.js
      - tests/lib/http-test-origin.js
      - tools/check-graphics-counterexamples.cjs
      - tools/check-graphics-expansion-counterexamples.cjs
      - tools/check-expedition-graphics-counterexamples.cjs
      - tools/check-visual-harmony-counterexamples.cjs
      - .github/workflows/kepler-graphics-review.yml
permissions:
  contents: read
concurrency:
  group: graphics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Audit findings through real native game rendering
        run: node tests/test_graphic_polish.js
      - name: Selected command-centre HUD and controlled regressions
        run: |
          node tests/test_command_shell.js
          node tools/check-command-shell-counterexamples.cjs
          node tests/http-run.js test_command_quest_closed_layout.js
          node tools/check-command-quest-closed-counterexample.cjs
          node tests/http-run.js test_zweite_ebene.js
          node tools/check-command-secondary-counterexample.cjs
          node tests/test_resource_animation_frames.js
          node tools/check-resource-animation-counterexample.cjs
          node tests/http-run.js test_schirmfrage.js
          node tools/check-command-menu-gating-counterexample.cjs
      - name: Saved native menu position and all seven controlled faults
        run: |
          node tests/http-run.js test_command_menu_position.js
          node tools/check-command-menu-position-counterexamples.cjs
      - name: Remaining illustrated systems and native actions
        run: node tests/test_visual_details.js
      - name: Remaining audit counterexamples must fail
        run: node tools/check-visual-details-counterexamples.cjs
      - name: Readable navigation and explicit full and compact header contracts
        run: node tests/http-run.js test_reiterleiste.js test_reitergruppen.js test_verdichtung.js test_gegenstandskatalog.js test_kopfzeile_tippziele.js
      - name: Every controlled audit regression must fail
        run: |
          node tools/check-graphic-polish-counterexamples.cjs
          node tools/check-mobile-polish-counterexamples.cjs
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: 00fe250194f419e1b0063f24da146bbb5c7041c7
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Sandboxed rating-card regression
        run: node tests/http-run.js test_bewertungskarte.js
      - name: Required checks and actual graphics interactions
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          node tests/run.js --nur-pflicht
          node tests/http-run.js test_uebersicht_schrift.js test_beschriftung_ausweichen.js
          node tests/http-run.js test_formensprache.js test_versionscheck.js test_pushziele.js test_kopfzeile_chips.js
          node tests/test_graphics_refresh.js
          node tests/test_graphics_expansion.js
          node tests/http-run.js test_hscroll.js test_expeditionsbox_cache.js
          node tests/http-run.js test_planeten_texturen.js test_kartenbeschriftung.js test_asteroid_trefferflaeche.js test_karte_handy_bedienung.js test_kartenfokus.js test_kartenresize.js test_kartengroesse.js
      - name: Native deferred WebP graphics and retained PNG fallback
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          node tests/test_graphics_loading.js
          node tools/check-graphics-loading-counterexamples.cjs
      - name: Native graphics unlocking and every controlled fault
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          node tests/test_graphics_unlock.js
          node tools/check-graphics-unlock-counterexamples.cjs
      - name: Canonical ship atlases and every controlled renderer fault
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          node tests/test_ship_raster_art.js
          node tools/check-ship-raster-art-counterexamples.cjs
      - name: Native fixture initialization failure closes its HTTP server
        run: node tools/check-ship-raster-fixture-counterexample.cjs
      - name: Native map menu scrolling and original scanner counterexample
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: node tools/check-map-menu-scroll-scope-counterexample.cjs
      - name: Native combat FX, boss and rift rasters with controlled regressions
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          node tests/test_combat_raster_art.js
          node tools/check-combat-raster-art-counterexamples.cjs
      - name: Behavioral and layout counterexamples must fail
        run: |
          node tools/check-graphics-counterexamples.cjs
          node tools/check-graphics-expansion-counterexamples.cjs
          node tools/check-expedition-graphics-counterexamples.cjs
          node tools/check-combat-graphics-counterexamples.cjs
          node tools/check-overview-hint-spacing-counterexample.cjs
          node tools/check-mission-status-close-counterexample.cjs
          node tools/check-map-focus-counterexamples.cjs
      - name: Native custom prices, module art and missing-fleet explanations
        run: |
          node tests/http-run.js test_abgrundbezug.js test_iconabdeckung.js test_sperrgrund_fortschritt_galaxie.js
          node tools/check-visual-detail-regressions.cjs
      - name: Compare map findings with the release baseline
        if: failure()
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          git fetch --no-tags --depth=1 origin 6550cb2fdd25f5d5012c61cf06c09d42f6f3b229
          git show 6550cb2fdd25f5d5012c61cf06c09d42f6f3b229:weltraum_kolonie.html > /tmp/kepler-release-baseline.html
          KEPLER_SPIELDATEI=/tmp/kepler-release-baseline.html node tests/http-run.js test_uebersicht_schrift.js test_beschriftung_ausweichen.js
  harmony:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Actual native controls, keyboard focus, themes and responsive panels
        run: node tests/test_visual_harmony.js
      - name: Complete building and defense overview with native selection and orders
        run: node tests/test_graphics_expansion.js
      - name: Release numbering and generated patchnotes
        run: node tests/http-run.js --nummer
      - name: Existing native subtab form and keyboard regression
        run: node tests/http-run.js test_unterreiter_form.js
      - name: Controlled visual faults must fail the corresponding checks
        run: node tools/check-visual-harmony-counterexamples.cjs
      - name: Install exact development-only language compiler dependencies
        run: npm install --prefix tools/i18n --no-save --package-lock=false --ignore-scripts acorn@8.15.0 acorn-walk@8.3.4
      - name: Language compiler units and controlled loader regressions
        run: |
          node --test tools/i18n/test.cjs
          node tools/check-lazy-language-unit-counterexamples.cjs
      - name: Native lazy language, service worker and every controlled fault
        run: |
          node tests/test_lazy_language_catalog.js
          node tools/check-lazy-language-counterexamples.cjs
      - name: Existing complete English content and real locale interactions
        run: |
          node tests/http-run.js test_english_complete.js test_english_locale.js test_i18n_testkontext.js
          node tools/i18n/check-counterexamples.cjs
  ship-detail-mining:
    runs-on: ubuntu-latest
    # Bound, not a timing claim: 10 asteroid + 3 sharpness controller children
    # and 2 direct positives each retain their 180s native limit (45min total).
    # The remaining 10min cover browser setup, required checks and raw artifacts.
    timeout-minutes: 55
    env:
      KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: 00fe250194f419e1b0063f24da146bbb5c7041c7
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated native detail browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Record all 139 runtime files and independent test package inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ship-detail-evidence
          git rev-parse HEAD > .ship-detail-evidence/frontend-commit.txt
          git -C .review-backend rev-parse HEAD > .ship-detail-evidence/backend-commit.txt
          test "$(cat .ship-detail-evidence/backend-commit.txt)" = 00fe250194f419e1b0063f24da146bbb5c7041c7
          sha256sum weltraum_kolonie.html kepler-graphics.css service-worker.js kepler-english.json kepler-gfx-*.png kepler-gfx-*.webp .review-backend/server.js > .ship-detail-evidence/source.sha256
          test "$(wc -l < .ship-detail-evidence/source.sha256)" -eq 139
          test "$(grep -Ec '  kepler-gfx-.*\.png$' .ship-detail-evidence/source.sha256)" -eq 67
          test "$(grep -Ec '  kepler-gfx-.*\.webp$' .ship-detail-evidence/source.sha256)" -eq 67
          sha256sum docs/ship-art-package.json docs/combat-art-package.json docs/remaining-art-package.json docs/ship-detail-art-package.json docs/asteroid-mining-art-package.json docs/ship-detail-art-prompts.json docs/asteroid-mining-art-prompts.json tests/test_ship_raster_art.js tests/test_ship_raster_sharpness.js tests/test_asteroid_raster_art.js tools/check-ship-raster-sharpness-counterexamples.cjs tools/check-asteroid-raster-counterexamples.cjs tests/http-run.js tests/lib/*.js .github/workflows/kepler-graphics-review.yml > .ship-detail-evidence/inputs.sha256
      - name: Required checks and real sharpness and asteroid controllers
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c .ship-detail-evidence/source.sha256
          sha256sum -c .ship-detail-evidence/inputs.sha256
          node tests/run.js --nur-pflicht 2>&1 | tee .ship-detail-evidence/required.log
          node tests/http-run.js test_ship_raster_sharpness.js 2>&1 | tee .ship-detail-evidence/sharpness-native.log
          node tools/check-ship-raster-sharpness-counterexamples.cjs 2>&1 | tee .ship-detail-evidence/sharpness-controller.log
          node tests/http-run.js test_asteroid_raster_art.js 2>&1 | tee .ship-detail-evidence/asteroid-native.log
          node tools/check-asteroid-raster-counterexamples.cjs 2>&1 | tee .ship-detail-evidence/asteroid-controller.log
      - name: Frozen runtime and test packages must survive every native fault
        if: always()
        run: |
          sha256sum -c .ship-detail-evidence/source.sha256
          sha256sum -c .ship-detail-evidence/inputs.sha256
      - name: Preserve original detail and asteroid child evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ship-detail-evidence
          shopt -s nullglob
          for evidence in "$GITHUB_WORKSPACE"/../ship-sharpness-2026-10-14/counter-* "$GITHUB_WORKSPACE"/../ship-sharpness-2026-10-14/asteroid-counter-*; do
            if [ -d "$evidence" ]; then
              cp -a -- "$evidence" .ship-detail-evidence/
              diff -qr -- "$evidence" ".ship-detail-evidence/$(basename "$evidence")"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepler-ship-detail-mining-review
          path: .ship-detail-evidence/
          include-hidden-files: true
          retention-days: 7
  remaining-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: 00fe250194f419e1b0063f24da146bbb5c7041c7
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Required checks against actual source and pinned backend
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: node tests/run.js --nur-pflicht
      - name: Record actual frontend backend and all 139 additive runtime source hashes
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/kepler-remaining-tested-fe-commit.txt
          git -C .review-backend rev-parse HEAD | tee /tmp/kepler-remaining-tested-be-commit.txt
          test "$(cat /tmp/kepler-remaining-tested-be-commit.txt)" = 00fe250194f419e1b0063f24da146bbb5c7041c7
          sha256sum weltraum_kolonie.html kepler-graphics.css service-worker.js kepler-english.json kepler-gfx-*.png kepler-gfx-*.webp .review-backend/server.js > /tmp/kepler-remaining-tested-source.txt
          test "$(wc -l < /tmp/kepler-remaining-tested-source.txt)" -eq 139
          test "$(grep -Ec '  kepler-gfx-.*\.png$' /tmp/kepler-remaining-tested-source.txt)" -eq 67
          test "$(grep -Ec '  kepler-gfx-.*\.webp$' /tmp/kepler-remaining-tested-source.txt)" -eq 67
      - name: Native remaining motifs and all controlled consumer regressions
        shell: bash
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          set -euo pipefail
          sha256sum -c /tmp/kepler-remaining-tested-source.txt
          node tests/test_remaining_raster_art.js 2>&1 | tee /tmp/kepler-remaining-native.log
          node tools/check-remaining-raster-art-counterexamples.cjs 2>&1 | tee /tmp/kepler-remaining-counter.log
          sha256sum -c /tmp/kepler-remaining-tested-source.txt
      - name: Original background cache and real texture readiness regression
        shell: bash
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          set -euo pipefail
          node tools/check-kulissenplanet-cache-counterexample.cjs 2>&1 | tee /tmp/kepler-remaining-background-counter.log
      - name: Original station facts and canonical raster layout regressions
        shell: bash
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          set -euo pipefail
          node tools/check-vorposten-raster-layout-counterexamples.cjs 2>&1 | tee /tmp/kepler-remaining-outpost-counter.log
      - name: Frozen source must survive every native and controlled fault
        if: always()
        run: sha256sum -c /tmp/kepler-remaining-tested-source.txt
      - name: Preserve original native evidence inside the workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/.remaining-raster-evidence"
          mkdir -p "$destination"
          shopt -s nullglob
          for evidence in "$GITHUB_WORKSPACE"/../remaining-graphics-2026-10-13/remaining-raster-counter-* "$GITHUB_WORKSPACE"/../graphics-complete-2026-10-13/kulissen-cache-counter-* "$GITHUB_WORKSPACE"/../graphics-complete-2026-10-13/vorposten-raster-layout-counter-*; do
            if [ -d "$evidence" ]; then
              cp -a -- "$evidence" "$destination/"
              diff -qr -- "$evidence" "$destination/$(basename "$evidence")"
            fi
          done
          for log in /tmp/kepler-remaining-tested-fe-commit.txt /tmp/kepler-remaining-tested-be-commit.txt /tmp/kepler-remaining-tested-source.txt /tmp/kepler-remaining-native.log /tmp/kepler-remaining-counter.log /tmp/kepler-remaining-background-counter.log /tmp/kepler-remaining-outpost-counter.log; do
            if [ -f "$log" ]; then
              cp -a -- "$log" "$destination/"
              cmp -- "$log" "$destination/$(basename "$log")"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepler-remaining-raster-review
          path: .remaining-raster-evidence/
          include-hidden-files: true
          retention-days: 7

  mobile-settings:
    if: github.head_ref == 'codex/mobile-settings-compact' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: 00fe250194f419e1b0063f24da146bbb5c7041c7
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native mobile regression environment
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Native mobile settings and compact graphics
        run: node tests/http-run.js test_mobile_settings_compact.js
      - name: Complete genuine mobile source counterexamples
        run: node tools/check-mobile-settings-compact-counterexamples.cjs
      - name: Preserve complete native mobile evidence
        if: always()
        shell: python
        run: |
          import hashlib, os, shutil
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          source = workspace.parent / 'mobile-settings-compact-2026-10-15'
          target = workspace / '.mobile-settings-evidence'
          cases = sorted(source.glob('counter-*'))
          assert cases, 'No native mobile counterexample receipts exist'
          assert not target.exists(), 'Never overwrite native mobile evidence'
          expected = {}
          for case in cases:
              assert case.is_dir(), 'Expected a native counterexample directory'
              for file in case.rglob('*'):
                  if file.is_file():
                      expected[str(file.relative_to(source))] = hashlib.sha256(file.read_bytes()).hexdigest()
              shutil.copytree(case, target / case.name)
          actual = {str(file.relative_to(target)): hashlib.sha256(file.read_bytes()).hexdigest()
                    for file in target.rglob('*') if file.is_file()}
          assert expected and actual == expected, 'Native mobile evidence copy changed bytes'
          print(f'Preserved {len(actual)} native mobile evidence files with identical SHA-256 hashes')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepler-mobile-settings-review
          path: .mobile-settings-evidence/
          include-hidden-files: true
          retention-days: 7
