name: Kepler graphics review
on:
  pull_request:
    branches: [main]
    paths:
      - weltraum_kolonie.html
      - kepler-graphics.css
      - kepler-gfx-*.png
      - tests/test_graphics_refresh.js
      - tests/test_bewertungskarte.js
      - tests/http-run.js
      - tools/check-graphics-counterexamples.cjs
      - .github/workflows/kepler-graphics-review.yml
permissions:
  contents: read
concurrency:
  group: graphics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  graphics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: dda5d5d3c1dbfb5eeef9ecf5c88227014415c1ef
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Sandboxed rating-card regression
        run: node tests/http-run.js test_bewertungskarte.js
      - name: Required checks and actual graphics interactions
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          node tests/run.js --nur-pflicht
          node tests/http-run.js test_uebersicht_schrift.js test_beschriftung_ausweichen.js
          node tests/http-run.js test_formensprache.js test_versionscheck.js test_pushziele.js test_kopfzeile_chips.js
          node tests/test_graphics_refresh.js
          node tests/http-run.js test_planeten_texturen.js test_kartenbeschriftung.js test_asteroid_trefferflaeche.js test_karte_handy_bedienung.js test_kartenfokus.js test_kartenresize.js test_kartengroesse.js
      - name: Behavioral and layout counterexamples must fail
        run: node tools/check-graphics-counterexamples.cjs
      - name: Compare map findings with the release baseline
        if: failure()
        env:
          KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
        run: |
          git fetch --no-tags --depth=1 origin 6550cb2fdd25f5d5012c61cf06c09d42f6f3b229
          git show 6550cb2fdd25f5d5012c61cf06c09d42f6f3b229:weltraum_kolonie.html > /tmp/kepler-release-baseline.html
          KEPLER_SPIELDATEI=/tmp/kepler-release-baseline.html node tests/http-run.js test_uebersicht_schrift.js test_beschriftung_ausweichen.js
