name: Ship overlay PC preflight
on:
  push:
    branches: [codex/ship-overlay-pc-check-20261016]
permissions:
  contents: read
concurrency:
  group: ship-overlay-pc-preflight
  cancel-in-progress: false
jobs:
  native-ship-fix:
    runs-on: [self-hosted, Linux, X64, pc-saschaneu]
    timeout-minutes: 45
    env:
      PC_CHROMIUM_GPU: '1'
      KEPLER_BACKEND_SERVER: ${{ github.workspace }}/.review-backend/server.js
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GameGeeeeek/kolonie-kepler7-backend
          ref: 00fe250194f419e1b0063f24da146bbb5c7041c7
          path: .review-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the existing PC GPU browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KEPLER_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Native ship regressions and genuine original-overlay counterexample
        run: node tools/ship-overlay-pc-preflight.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-overlay-pc-preflight
          path: .ship-overlay-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
