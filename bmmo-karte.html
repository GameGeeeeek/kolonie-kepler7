<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bewertung auf browsermmorpg.com</title>
<meta name="robots" content="noindex, nofollow">
<!--
  Die Bewertungskarte von browsermmorpg.com (Eintrag #1799) - und sonst nichts.

  Diese Datei wird AUSSCHLIESSLICH als
      <iframe sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox">
  in die Themenseiten eingebettet. Ohne allow-same-origin bekommt der Rahmen eine undurchsichtige
  Herkunft: kein localStorage, keine Cookies, kein Zugriff auf die einbettende Seite. Das ist der
  ganze Grund fuer die eigene Datei. Das Spiel haelt sein Sitzungs-Token in localStorage und
  schuetzt es mit connect-src 'self' (tests/test_csp_verbindung.js) - ein fremdes Skript, das
  direkt in IRGENDEINER Seite von www.gamegeeeeek.de laeuft, koennte dieses Token lesen, denn
  localStorage gehoert der Herkunft, nicht der einzelnen Seite. Deshalb kommt das Skript nie
  direkt in eine Seite, auch nicht in eine Themenseite ohne Login-Maske.

  Die CSP unten ist der zweite Riegel hinter dem Sandkasten: Das Skript darf nur mit
  browsermmorpg.com sprechen. 'unsafe-inline' fuer Stile ist noetig, weil die Karte ihre Farben
  als style-Attribut in ihr Markup schreibt (rating_card.js, buildStyleVars).

  Was die Karte tut (gemessen am Skript, 11.09.2026): EIN GET auf
  browsermmorpg.com/ajax/rating_card.php?id=1799 ohne Cookies (credentials:"omit"), dann ein
  "Vote"-Link auf browsermmorpg.com/vote.php?id=1799 in einem neuen Tab. Abstimmen geht dort ohne
  Konto ("Did you like this game? Yes / No"), alle sechs Stunden.

  Waechter: tests/test_bewertungskarte.js
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://browsermmorpg.com; style-src https://browsermmorpg.com 'unsafe-inline'; connect-src https://browsermmorpg.com; img-src https://browsermmorpg.com data:; base-uri 'none'; form-action 'none'">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<!-- Woertlich der Einbettungscode aus dem Konto bei browsermmorpg.com. Die Farbattribute wirken
     nur bei Premium-Eintraegen (rating_card.js: "non-premium games always render with the classic
     theme and default colours") - die Karte bleibt also weiss, egal was hier steht. -->
<div class="bmmorc" data-id="1799" data-theme="classic" data-accent="#2563eb" data-title="#111827" data-text="#111827" data-bg="#ffffff" data-btnbg="#ffffff" data-btntxt="#111827"></div>
<script async src="https://browsermmorpg.com/js/rating_card/rating_card.js"></script>
</body>
</html>
